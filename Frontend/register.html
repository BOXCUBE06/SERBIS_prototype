<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERBIS - Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen active" style="align-items:center;justify-content:center;min-height:100vh;width:100%;background:linear-gradient(160deg,#e0f0e8,#f2f8f4);">
  <div class="login-wrap" style="padding:40px 20px;max-width:420px;width:100%;">
    <div class="login-logo-row">
      <img class="login-logo" src="images/mdrrmo_logo2.png" alt="MDRRMO">
      <div>
        <div class="login-brand">MDRRMO Echague</div>
        <div class="login-brand"><small>Municipal Disaster Risk Reduction Management Office</small></div>
      </div>
    </div>
    <div class="login-app">SERBIS</div>
    <div class="login-sub">Service and Emergency Response Bureau Information System</div>
    <div class="login-card">
      <h3>Create an Account</h3>
      <div id="registerErr" class="login-err">Please fill out all required fields.</div>
      <div class="login-inp"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg><input id="regName" type="text" placeholder="Full Name"></div>
      <div class="login-inp"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><input id="regEmail" type="email" placeholder="Email address"></div>
      <div class="login-inp"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="regPass" type="password" placeholder="Password"></div>
      <div class="login-inp"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="regConfirmPass" type="password" placeholder="Confirm password"></div>
      <div class="login-inp" style="padding:10px 14px;">
        <svg viewBox="0 0 24 24"><path d="M12 3l4 4H8l4-4z"/><path d="M4 8h16v11H4z"/></svg>
        <select id="regBarangay" style="border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;color:#333;width:100%;">
          <option value="">Select Barangay</option>
          <option>Brgy. San Fabian</option>
          <option>Brgy. Divisoria</option>
          <option>Brgy. Calamagui</option>
          <option>Brgy. Malitao</option>
          <option>Brgy. Sta. Rosa</option>
          <option>Brgy. Centro</option>
        </select>
      </div>
      <button class="login-btn" id="registerBtn" style="margin-top:6px;">REGISTER</button>
      <div class="login-footer">Already have an account? <a href="index.html" style="color:var(--primary);text-decoration:none;font-weight:700;">Login here</a></div>
    </div>
  </div>
</div>
</body>
</html>
