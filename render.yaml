# Render Blueprint for the SERBIS API.
#
# Render reads this from the repository root, which is why it sits here and not
# beside the Dockerfile. Each service sets rootDir, and the docker paths below
# are relative to that rootDir.
#
# There is no worker service. routes/console.php schedules exactly one command
# and app/ dispatches no queued jobs at all, so an always-on worker would bill
# full time to run sanctum:prune-expired once a day. The cron service below does
# that instead.

# Shared because the cron job runs the same image, and docker-entrypoint.sh
# refuses to start without the full set — APP_KEY, every DB_*,
# ADMIN_SEED_PASSWORD and MYSQL_ATTR_SSL_CA. Duplicating them per service is how
# the two drift apart.
#
# `sync: false` means Render prompts for the value on first apply and never
# stores it here. Every secret uses it.
envVarGroups:
  - name: serbis-shared
    envVars:
      - key: APP_NAME
        value: SERBIS
      - key: APP_ENV
        value: production
      # AppServiceProvider::assertDebugIsOffInProduction() throws REFUSING TO
      # START if this is true while APP_ENV is production. The app will not boot
      # at all, which is the intended behaviour, not a misconfiguration.
      - key: APP_DEBUG
        value: false
      # php artisan key:generate --show, freshly generated. NEVER the dev key.
      - key: APP_KEY
        sync: false
      # The assigned onrender.com hostname, or the custom domain once there is
      # one. Feeds asset(), Storage::url() and signed URLs.
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      # Aiven MySQL 8. Host, port, database and user come from the Aiven service
      # overview; none of them is a Render reference variable, because the
      # database lives outside Render.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # The CA baked into the image. config/database.php passes this through
      # array_filter, so a wrong path silently drops certificate verification
      # while still connecting over TLS — docker-entrypoint.sh stats the file
      # and refuses to boot rather than let that happen.
      - key: MYSQL_ATTR_SSL_CA
        value: /var/www/html/storage/certs/aiven-ca.pem

      # Read once, by ProductionAdminSeeder, to create the single admin account.
      # It is never used again: the seeder skips when that account exists, so a
      # redeploy cannot reset a password the admin has since changed.
      - key: ADMIN_SEED_PASSWORD
        sync: false

      # All three are database-backed, so no Redis service is needed. The tables
      # are created by the same migrate the entrypoint runs.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Two Supabase buckets with opposite access rules. Setting both to the
      # same disk puts government ID scans in the public bucket.
      - key: UPLOADS_PRIVATE_DISK
        value: s3
      - key: UPLOADS_PUBLIC_DISK
        value: s3_public
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      # Supabase addresses buckets by path; the default virtual-host style
      # resolves to a hostname that does not exist.
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_PUBLIC_BUCKET
        sync: false
      - key: AWS_PUBLIC_URL
        sync: false

      # NEVER ses: config/services.php reads AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY for it — the same two variables Supabase Storage
      # uses above. Mail is only the OTP's fallback path; SMS is the real one.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: SERBIS

      # A hard deploy blocker. Registration OTPs go by SMS, so without this
      # token nobody can complete a signup. PhilSMS has no sandbox: every send
      # costs real credit.
      - key: PHILSMS_TOKEN
        sync: false
      - key: PHILSMS_SENDER_ID
        value: PhilSMS

      - key: SANCTUM_ADMIN_EXPIRATION
        value: 480
      - key: SANCTUM_RESIDENT_EXPIRATION
        value: 43200

      # The admin panel is not hosted for the alpha: it runs on the presenter's
      # machine against this API. config/cors.php reads this variable directly,
      # so hosting it later is a value change and a redeploy, not a code change.
      - key: ADMIN_FRONTEND_URL
        sync: false

services:
  - type: web
    name: serbis-api
    runtime: docker
    # Singapore is chosen for latency to Echague, not for availability.
    # Confirm both `plan` values on the first apply: Render does not offer every
    # instance type for every service type or region, and a cron job in
    # particular may not be available on the free plan. Neither value was
    # verified from this machine.
    plan: free
    region: singapore
    rootDir: Backend/SERBIS-Backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Laravel's own health endpoint, registered in bootstrap/app.php. It touches
    # no view and no database, so it answers even while something else is wrong.
    healthCheckPath: /up
    envVars:
      - fromGroup: serbis-shared

  - type: cron
    name: serbis-schedule
    runtime: docker
    plan: free
    region: singapore
    rootDir: Backend/SERBIS-Backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # 18:00 UTC is 02:00 in Manila. The one scheduled command is
    # sanctum:prune-expired --hours=24, which clears rows for tokens that
    # already stopped being accepted a day ago — housekeeping, never
    # enforcement, so the hour does not matter to any user.
    #
    # Note what dockerCommand does and does not replace: it overrides CMD, not
    # ENTRYPOINT. So each nightly run walks the full boot sequence first —
    # env validation, config:cache, route:cache, migrate --force, db:seed — and
    # only then runs schedule:run. Every one of those steps is a no-op against a
    # provisioned database, which is why this is safe, but it does mean the cron
    # job fails loudly if the database is unreachable at 02:00 rather than
    # silently skipping its work.
    schedule: "0 18 * * *"
    dockerCommand: php artisan schedule:run
    envVars:
      - fromGroup: serbis-shared
