name: serbis
description: >
  SERBIS — Echague MDRRMO mobile application. Lets residents submit and
  track non-emergency service requests, and read offline disaster
  preparedness materials in English or Filipino.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.0
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  # A downloaded material is only useful if it can be opened: open_filex hands
  # the cached file to the platform viewer (and to Android's FileProvider),
  # url_launcher opens the server copy when there is no saved one.
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  # Push, step 1: register the device with FCM and read its token back.
  # firebase_core is not optional — firebase_messaging cannot initialise
  # without it. Android needs android/app/google-services.json, which is not in
  # the repository; a build without it fails at processGoogleServices.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  image_picker: ^1.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  # E2E: drives the real app on a device/emulator/web, unlike flutter_test's
  # in-VM widget tests. Run with `flutter test integration_test`.
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generates the launcher icons from assets/images/serbis_logo.png:
  # `dart run flutter_launcher_icons`. The output is committed, so this only
  # runs when the logo changes.
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/serbis_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/serbis_logo.png

  # Bundled, not fetched. `google_fonts` downloaded its fonts from
  # fonts.gstatic.com on first use, so a first launch with no signal fell back
  # to the platform default — every size and metric the layout was tuned against
  # would change, on exactly the launch this app exists for. It was also an
  # unadvertised third-party request at startup.
  #
  # One family, Plus Jakarta Sans (SIL OFL, licence beside the files), the same
  # face the admin panel uses. Four static weights: the UI asks for 400, 500,
  # 600 and 700 and nothing else. Full Latin set, so ñ, the accented vowels, ₱
  # and the '·' separator this UI uses are all there.
  # Static instances rather than the variable font: Flutter maps `fontWeight`
  # onto a declared weight, and reaching a variable font's `wght` axis needs
  # `fontVariations` on every TextStyle, which `ThemeData.textTheme` would not
  # carry.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
