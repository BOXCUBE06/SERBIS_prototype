<!doctype html>
<html lang="en">
<head>

</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B4A}a:hover{color:#174F37}
::selection{background:#CFE5D8;color:#10251B}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2E8A5C;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sec{display:flex;align-items:baseline;gap:8px;margin:28px 4px 10px}
.sec.first{margin-top:4px}
.sec h2{margin:0;font-size:16px;font-weight:600;color:#1E3D2F}
.sec span{font-size:15px;color:#566059}
.card{background:#fff;border:1px solid #ECE7DE;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.list{background:#fff;border:1px solid #ECE7DE;border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:68px;box-sizing:border-box;text-decoration:none;color:#1C2B24;background:#fff;border:none;width:100%;text-align:left;font:inherit}
.row+.row{border-top:1px solid #F1EDE5}
.tx{flex-grow:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.tn{font-size:16px;font-weight:600;line-height:1.3}
.meta{font-size:14px;line-height:1.4;color:#4A544E}
.body{font-size:15px;line-height:1.5;color:#3E4842}
.state{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ico{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:#EEF4F0;display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:15px;font-weight:600;color:#1C2B24}
.opt{font-weight:400;color:#6B746F}
.req{color:#A8352A}
.in{height:52px;box-sizing:border-box;border:1px solid #D9D2C6;border-radius:12px;background:#FBFAF7;padding:0 14px;font-size:16px;color:#1C2B24;width:100%}
.in::placeholder,textarea::placeholder{color:#5F6862}
select.in{appearance:none;-webkit-appearance:none}
.in.err{border:2px solid #A8352A;background:#fff}
.errt{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:1.4;color:#A8352A;font-weight:500}
.hint{font-size:14px;line-height:1.4;color:#4A544E}
.btn{height:52px;border:none;border-radius:12px;background:#1F6B4A;color:#fff;font-size:16px;font-weight:600;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn2{height:52px;border:1px solid #D9D2C6;border-radius:12px;background:#fff;color:#1C2B24;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btnr{height:52px;border:none;border-radius:12px;background:#A8352A;color:#fff;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.link{min-height:44px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;text-decoration:none;color:#1F6B4A;background:none;border:none;padding:0;cursor:pointer}
.dlink{min-height:48px;padding:0 16px;border:1px solid #E3BDB6;border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:#A8352A;cursor:pointer;align-self:flex-start}
.seg{display:grid;gap:4px;padding:4px;background:#EFEAE1;border-radius:12px}
.seg button{height:44px;border:none;border-radius:9px;background:transparent;font-size:15px;color:#3E4842;cursor:pointer}
.seg button[aria-checked=true],.seg button[aria-selected=true]{background:#fff;font-weight:600;color:#1F6B4A;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opt2{text-align:left;border:1px solid #D9D2C6;background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;font-size:16px;font-weight:600;color:#1C2B24;cursor:pointer}
.opt2[aria-checked=true]{border:2px solid #1F6B4A;padding:13px;background:#F3F8F5}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.sk{background:#ECE6DC;border-radius:6px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{to{transform:translateX(100%)}}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite;box-sizing:border-box}
.spin.g{border-color:#D5E5DB;border-top-color:#1F6B4A}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sk::after,.spin{animation:none}}
ol{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:20px 1fr;column-gap:12px}
.rail{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.ln{width:2px;flex-grow:1;min-height:10px;background:#E6E0D6}
.sl{padding:0 0 14px;font-size:15px;line-height:1.4}
.lab{font-size:13px;font-weight:600;letter-spacing:.02em;color:#566059;margin:14px 0 6px 2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EE; font-family: 'Plus Jakarta Sans', sans-serif; color: #1C2B24; display: flex; flex-direction: column; overflow: hidden; position: relative">
<header style="padding: 48px 16px 20px; background: #16483A; border-radius: 0 0 20px 20px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; align-items: center; gap: 12px"><button aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 20px; font-weight: 600; color: #fff">Request an ambulance</h1><div style="font-size: 14px; color: rgba(255,255,255,0.88)">Step 1 of 5 · Patient</div></div></div><div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px"><span style="height: 4px; border-radius: 2px; background: #fff"></span><span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"></span><span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"></span><span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"></span><span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"></span></div></header><main style="flex-grow: 1; padding: 16px 16px 24px; overflow: hidden; display: flex; flex-direction: column"><div class="note" style="background: #FBF3E6; color: #6E3A08"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4B0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5v.01"></path></svg><span>For non-emergency transport only. In an emergency, <a href="#" style="color: #6E3A08; font-weight: 600">call the hotline</a>.</span></div><div style="height: 16px"></div><div class="field"><span class="lbl">Who needs the ambulance?</span><div role="radiogroup" class="seg" style="grid-template-columns: 1fr 1fr"><button role="radio" aria-checked="false">Myself</button><button role="radio" aria-checked="true">Someone else</button></div></div><div style="height: 16px"></div><label class="field"><span class="lbl">Full name <span class="req">*</span></span><input class="in" placeholder="e.g. Maria Santos"></label><div style="height: 16px"></div><div style="display: grid; grid-template-columns: 100px 1fr; gap: 10px"><label class="field"><span class="lbl">Age <span class="req">*</span></span><input class="in" placeholder="62"></label><label class="field"><span class="lbl">Contact number <span class="req">*</span></span><input class="in" placeholder="" value="0917 000 0101"></label></div><div style="height: 16px"></div><label class="field"><span class="lbl">Barangay <span class="req">*</span></span><span style="position: relative"><select class="in"><option>Choose barangay</option></select><span style="position: absolute; right: 14px; top: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E4842" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></span></span></label></main><div style="background: #fff; border-top: 1px solid #ECE7DE; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px"><div style="display: grid; grid-template-columns: 1fr; gap: 10px"><button class="btn">Next: Trip</button></div></div>
</div>
